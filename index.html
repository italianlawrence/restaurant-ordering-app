<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel = 'stylesheet' href = 'style.css'>
    <title>Restaurant Ordering App </title>
</head>
<body>
    <div class = 'bannerContainer'>
        <div class = 'infoBannerContainer'>
            <h1> ItalianLawrence's Diner            </h1>
            <p> The best burgers and pizza in town  </p>
        </div>
    </div>

    <div id = 'food-universal-container'>
        
    </div>

    <h2> Your order </h2>
    
    <div id = 'order-container'>
        
    </div>


    <div id = 'order-btn-container'>

    </div>

    <form class = 'form-data hidden' id = 'form-data'>
        <h2> Enter card details </h2>
        <input type = 'text' placeholder = 'Insert your name' id = 'name' required>
        <input type = 'text' pattern = '[0-9]{16}'  placeholder = 'Insert your card number' required>
        <input type = 'text' pattern = '[0-9]{3}' placeholder = 'CVV' required>
        <button type = 'submit' class = 'btn-pay' id = 'btn-pay'> Pay </button>
    </form> 

    <div class="overlay hidden"></div>
    <script src = 'script.js' type = 'module'></script>
</body>
</html>
